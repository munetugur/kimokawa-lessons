<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>レッスン05 アナボコ と ニョロ</title>
<style>
:root{
  --ink:#1E2433; --ink2:#4A5266; --bg:#F4F6FA; --card:#FFFFFF;
  --yellow:#FFD23F; --orange:#FF8A3D; --red:#FF5A6E; --teal:#2BB3A3; --blue:#3D7BE0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
@media (max-width:480px){header.top .in{gap:6px;padding:6px 10px}.pill{padding:0 11px;font-size:14px;min-height:40px}.who-chip{max-width:28vw !important;padding:0 10px !important;margin-right:0 !important}}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
header.top{position:sticky;top:0;z-index:10;background:rgba(244,246,250,.95);border-bottom:1px solid #DDE2EA}
header.top .in{max-width:900px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:10px}
header.top b{font-size:15px;margin-right:auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;font-size:15px;border:0;font-family:inherit;cursor:pointer;white-space:nowrap}
.pill.light{background:#fff;color:var(--ink);border:2px solid var(--ink)}
main{max-width:900px;margin:0 auto;padding:8px 16px 16px;display:flex;flex-direction:column;min-height:calc(100dvh - 58px)}
.dots{display:flex;gap:6px;justify-content:center;padding:4px 0 8px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:#D5DAE3}
.dots i.on{background:var(--orange);width:26px;border-radius:5px}
.dots i.done{background:#F5B98F}
.scr{display:none;flex:1;flex-direction:column}
.scr.on{display:flex}
.art{flex:1;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:28px;min-height:260px;position:relative;overflow:hidden}
.art.dark{background:#1B2030}
.art.soft{background:#FFF8E1}
.art > svg{width:100%;height:100%;max-height:62dvh;touch-action:none;user-select:none;-webkit-user-select:none}
.txt{font-size:clamp(21px,4.2vw,30px);font-weight:800;line-height:1.5;text-align:center;padding:14px 4px 6px;min-height:3.3em;display:flex;align-items:center;justify-content:center}
.ctl{display:flex;gap:12px;align-items:center;justify-content:center;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.btn{min-height:64px;min-width:64px;border-radius:999px;border:0;font-family:inherit;font-weight:800;font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 24px;text-decoration:none}
.btn.snd{background:#fff;border:3px solid var(--ink);color:var(--ink);padding:0}
.btn.back{background:#fff;border:3px solid #C9CED8;color:var(--ink2);padding:0}
.btn.next{background:var(--ink);color:#fff;min-width:160px}
.btn.next:disabled{background:#C9CED8;color:#fff;cursor:default}
.btn.next.go{animation:pulse 1.2s ease-in-out infinite}
.btn.big{background:var(--orange);color:#fff;font-size:26px;min-height:76px;padding:0 40px}
.btn.stamp{background:#fff;border:4px dashed var(--orange);color:var(--ink);font-size:24px}
.btn.stamp.on{background:var(--orange);border-style:solid;color:#fff}
.btn.stamp.got{animation:pop .5s ease-out 2}
/* iPad の 長押しで メニューや 文字えらびが 出ないように */
.art,.art *,.btn,.grid button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.btn.act{background:var(--teal);color:#fff}
.btn.act.on{background:var(--orange)}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:6px 14px;border-radius:999px;white-space:nowrap;pointer-events:none}
.art.dark .hint{background:#fff;color:var(--ink)}
.say{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 16px;font-weight:800;font-size:clamp(18px,3.6vw,24px);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.say.on{opacity:1}
.tools{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.tools .btn{min-height:56px;font-size:19px}
/* えらぶ・チェック */
.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:100%;max-width:620px;padding:14px}
.grid button{border-radius:22px;border:3px solid #E3E7EE;background:#fff;font-family:inherit;font-weight:800;font-size:clamp(14px,2.6vw,18px);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:12px 8px;min-height:clamp(140px,24vh,240px);line-height:1.35;font-size:clamp(15px,2.8vw,20px)}
.grid button .e{font-size:clamp(44px,10vw,76px);line-height:1.1}
.grid button svg{width:100%;max-width:220px;height:auto;max-height:180px}
.grid button.yes{border-color:var(--yellow);background:#FFF6CC;box-shadow:0 0 0 5px rgba(255,210,63,.35)}
.grid button.ok{border-color:var(--teal);background:#E0F5F2;box-shadow:0 0 0 5px rgba(43,179,163,.25)}
.grid button.no,.grid button.ng{animation:shake .4s}
.grid button.ng{border-color:var(--red)}
.grid button.check::after{content:"";}
.grid button.yes .e,.grid button.ok .e{animation:pop .3s}
.count{position:absolute;top:10px;right:14px;font-weight:800;font-size:18px;background:var(--bg);border-radius:999px;padding:4px 12px}
.art.dark .count{background:#2E3547;color:#fff}
/* つなぎかたの図 */
.dia-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px}
.dia-wrap svg{width:100%;height:auto;max-height:58dvh;background:#fff;border-radius:14px}
svg.dia [data-step]{transition:opacity .3s}
svg.dia .future{opacity:0}
svg.dia .now{animation:blink 1s ease-in-out infinite}
.stepno{position:absolute;top:10px;left:14px;font-weight:800;font-size:16px;background:var(--teal);color:#fff;border-radius:999px;padding:4px 12px}
/* おわり */
.end{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.end .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end a.btn{background:#fff;border:3px solid var(--ink);color:var(--ink);font-size:19px;min-height:56px}
.end a.btn.main{background:var(--ink);color:#fff}
.end .for{font-weight:800;font-size:18px;color:var(--ink2);text-align:center}
details.adult{margin-top:12px;background:#fff;border-radius:18px;padding:10px 16px;font-size:15px;line-height:1.7;color:var(--ink2)}
details.adult summary{font-weight:800;cursor:pointer;min-height:40px;display:flex;align-items:center}
/* はんにん さがし */
.hn{position:absolute;inset:0;background:rgba(27,32,48,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.hn.on{display:flex}
.hn .box{background:#fff;border-radius:22px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.hn h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.hn ol{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.hn li button{width:100%;text-align:left;min-height:56px;border-radius:14px;border:2px solid #E3E7EE;background:#fff;font:inherit;font-size:17px;font-weight:700;color:var(--ink);padding:8px 12px;cursor:pointer}
.hn li button.ok{border-color:var(--teal);background:#E0F5F2}
.hn .close{margin-top:10px;width:100%}
/* 動き */
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wob{0%,100%{transform:scale(1,1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.92,1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes slide{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.stripe{stroke-dasharray:6 24;animation:flow var(--spd,.9s) linear infinite}
.a-flow2{stroke-dasharray:6 14;animation:flow 1.2s linear infinite}
.a-slide{animation:slide 3s ease-in-out infinite}
.bob{animation:bob 2s ease-in-out infinite}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob .5s ease-in-out 2}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .6s linear infinite}
.blink{animation:blink 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

.lock h2{justify-content:center;font-size:22px;margin:12px 0 8px}
.lock h2::before{display:none}
.lock a{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:10px;border-radius:999px;text-decoration:none;font-weight:800}
.lock a.go{background:#1E2433;color:#fff}
.lock a.home{background:#F4F6FA;color:#1E2433}
</style>
<script>
(function(){
  if(window.KIMO_NOSTORE)return;
  var WHO=window.KIMO_WHO, PREV='04', st={};
  try{st=JSON.parse(localStorage.getItem(window.KIMO_KEY)||'{}')||{};}catch(e){return;}
  var hd=document.querySelector('header.top .in');
  if(hd&&WHO){var c=document.createElement('a');c.href='index.html';c.className='who-chip';c.textContent='👤 '+WHO;hd.insertBefore(c,hd.lastElementChild);}
  function lock(icon,title,html,goHref,goText){
    var d=document.createElement('div');d.className='lock';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
    var box=document.createElement('div');box.className='box';
    box.innerHTML='<div class="big">'+icon+'</div><h2>'+title+'</h2><p>'+html+'</p>'+(goHref?'<a class="go" href="'+goHref+'">'+goText+'</a>':'')+'<a class="home" href="index.html">いりぐちに もどる</a>';
    d.appendChild(box);document.body.appendChild(d);document.documentElement.style.overflow='hidden';
  }
  if(!WHO){lock('👤','だれが やる？','いりぐちで、じぶんの なまえを えらんでね。','index.html','なまえを えらぶ');return;}
  if(PREV&&!st[PREV]){lock('🔒','まだ ひらかないよ','さきに <b>04 シメツケ</b> の スタンプを ゲットしよう。','04_シメツケ.html','04 シメツケ へ');}
})();
</script>
<!--/lock-->
</body>
</html>
